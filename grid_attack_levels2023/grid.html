<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Attack Levels</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="grid.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <header class="w-full py-8 px-4 border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
            <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400 bg-clip-text text-transparent text-center sm:text-left">
                Grid Attack Levels
            </h1>
            <div class="flex items-center gap-3">
                <span class="text-xs uppercase tracking-wider px-3 py-1 bg-slate-800 text-slate-400 rounded-full font-medium border border-slate-700">
                    80 Level Solutions
                </span>
                <button id="expandAllBtn" class="text-xs font-semibold px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl transition shadow-lg shadow-indigo-600/20 active:scale-95">
                    Expand all
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        <div id="levelsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-20 opacity-0 transition-all duration-300 bg-emerald-600 text-white text-sm font-semibold px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 z-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>
        <span>¡Código copiado al portapapeles!</span>
    </div>

    <footer class="py-6 border-t border-slate-900 text-center text-xs text-slate-500">
        Grid Attack Solution Viewer &copy; 2023
    </footer>
    <script>
        const solutions = [
            /* Level 1 */ `#field {\ndisplay: grid;\ngrid-template-columns: 50% 50%;\n}`,
            /* Level 2 */ `#field {\ndisplay: grid;\ngrid-template-columns: 20% 40% 40%;\n}`,
            /* Level 3 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 25%);\n}`,
            /* Level 4 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 30%);\n}`,
            /* Level 5 */ `#field {\ndisplay: grid;\ngrid-template-columns: 100px 30%;\n}`,
            /* Level 6 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 1fr 1fr;\n}`,
            /* Level 7 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\n}`,
            /* Level 8 */ `#field {\ndisplay: grid;\ngrid-template-columns: 100px repeat(3, 1fr);\n}`,
            /* Level 9 */ `#field {\ndisplay: grid;\ngrid-template-columns: 20% 100px 1fr;\n}`,
            /* Level 10 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr auto 1fr;\n}`,
            /* Level 11 */ `#field {\ndisplay: grid;\ngrid-template-columns: 25% 50% 25%;\ngrid-template-rows: 100px 150px 1fr;\n}`,
            /* Level 12 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: 1fr 2fr 1fr;\n}`,
            /* Level 13 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: 1fr 2fr 1fr;\ncolumn-gap: 15px;\n}`,
            /* Level 14 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: 1fr 2fr 1fr;\ncolumn-gap: 5%;\n}`,
            /* Level 15 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: 1fr 2fr 1fr;\nrow-gap: 40px;\n}`,
            /* Level 16 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: 1fr 2fr 1fr;\ncolumn-gap: 10px;\nrow-gap: 15%;\n}`,
            /* Level 17 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: 1fr 2fr 1fr;\ngap: 20px;\n}`,
            /* Level 18 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 100px auto;\ngrid-template-rows: 1fr 1fr 100px;\ngap: 10% 20px;\n}`,
            /* Level 19 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: repeat(2, 1fr);\n}\n#greenLand {\ngrid-column-start: 3;\n}`,
            /* Level 20 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\ngrid-template-rows: repeat(2, 1fr);\n}\n#greenLand {\ngrid-column-start: 2;\ngrid-column-end: 4;\n}`,
            /* Level 21 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\ngrid-template-rows: repeat(2, 1fr);\ngap: 10px;\n}\n#greenLand {\ngrid-column-start: span 2;\n}`,
            /* Level 22 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: 100px 1fr;\ngap: 15px;\n}\n#greenLand {\ngrid-column-start: span 2;\n}`,
            /* Level 23 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: repeat(3, 1fr);\ngap: 10px;\n}\n#greenLand {\ngrid-row-start: 2;\n}`,
            /* Level 24 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: repeat(4, 1fr);\ngap: 10px;\n}\n#greenLand {\ngrid-row-start: 1;\ngrid-row-end: 5;\n}`,
            /* Level 25 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: repeat(4, 1fr);\ngap: 10px;\n}\n#greenLand {\ngrid-row-start: span 4;\n}`,
            /* Level 26 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: repeat(3, 1fr);\ngap: 10px;\n}\n#redLand {\ngrid-row-start: 1;\ngrid-row-end: 4;\ngrid-column-start: 1;\ngrid-column-end: 3;\n}`,
            /* Level 27 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\ngrid-template-rows: repeat(4, 1fr);\ngap: 15px;\n}\n#redLand {\ngrid-row-start: 3;\ngrid-row-end: 5;\ngrid-column-start: 2;\ngrid-column-end: 4;\n}`,
            /* Level 28 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\ngrid-template-rows: repeat(4, 1fr);\ngap: 10px;\n}\n#greenLand {\ngrid-column: 1/4;\ngrid-row: 2/5;\n}`,
            /* Level 29 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\ngrid-template-rows: repeat(4, 1fr);\ngap: 15px 10px;\n}\n#greenLand {\ngrid-column: 2/ span 2;\ngrid-row: 3/5;\n}\n#redLand {\ngrid-column: 4;\ngrid-row: 1/4;\n}`,
            /* Level 30 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(4, 1fr);\ngrid-template-rows: repeat(4, 1fr);\ngap: 15px;\ngrid-template-areas: "land land land." "land land land." "land land land." "....";\n}\n#redLand {\ngrid-area: land;\n}`,
            /* Level 31 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 2fr 1fr;\ngrid-template-rows: repeat(4, 1fr);\ngap: 15px;\ngrid-template-areas: "redLand redLand greenLand" "redLand redLand greenLand" "redLand redLand greenLand" ".. greenLand";\n}\n#greenLand {\ngrid-area: greenLand;\n}\n#redLand {\ngrid-area: redLand;\n}`,
            /* Level 32 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(3, 1fr);\ngrid-template-rows: repeat(3, 1fr);\ngap: 15px 10px;\ngrid-template-areas: "greenLand greenLand." "greenLand greenLand." "redLand redLand redLand";\n}\n#greenLand {\ngrid-area: greenLand;\n}\n#redLand {\ngrid-area: redLand;\n}`,
            /* Level 33 */ `#field {\ndisplay: grid;\ngrid-template-columns: min-content 1fr;\ngrid-template-rows: 1fr 1fr;\n}`,
            /* Level 34 */ `#field {\ndisplay: grid;\ngrid-template-columns: min-content 1fr;\ngrid-template-rows: 1fr min-content;\n}`,
            /* Level 35 */ `#field {\ndisplay: grid;\ngrid-template-columns: max-content 1fr;\ngrid-template-rows: 1fr 1fr;\n}`,
            /* Level 36 */ `#field {\ndisplay: grid;\ngrid-template-columns: max-content min-content;\ngrid-template-rows: 1fr 1fr;\n}`,
            /* Level 37 */ `#field {\ndisplay: grid;\ngrid-template-columns: minmax(250px, 1fr) 1fr;\ngrid-template-rows: 1fr 1fr;\ngap: 15px;\n}`,
            /* Level 38 */ `#field {\ndisplay: grid;\ngrid-template-columns: minmax(min-content, 200px) 150px;\ngrid-template-rows: 1fr 1fr;\n}`,
            /* Level 39 */ `#field {\ndisplay: grid;\ngrid-template-columns: minmax(max-content, 200px) minmax(min-content, auto);\ngrid-template-rows: 1fr 1fr;\n}`,
            /* Level 40 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(auto-fill, 150px);\ngap: 15px;\n}`,
            /* Level 41 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(auto-fill, minmax(150px, 1fr));\ngap: 15px;\n}`,
            /* Level 42 */ `#field {\ndisplay: grid;\ngrid-template-columns: repeat(auto-fit, minmax(100px, 1fr));\ngap: 15px;\n}`,
            /* Level 43 */ `#field {\ndisplay: grid;\ngrid-template: 100px 1fr 100px/100px 1fr 100px;\ngap: 20px;\n}`,
            /* Level 44 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: "redLand redLand redLand" ". greenLand greenLand" ". greenLand greenLand";\n}\n#greenLand {\ngrid-area: greenLand;\n}\n#redLand {\ngrid-area: redLand;\n}`,
            /* Level 45 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: "redLand redLand." 100px "blueLand greenLand greenLand" 200px "blueLand greenLand greenLand" 1fr / 1fr 1fr 1fr;\n}\n#greenLand {\ngrid-area: greenLand;\n}\n#redLand {\ngrid-area: redLand;\n}\n#blueLand {\ngrid-area: blueLand;\n}`,
            /* Level 46 */ `#field {\ndisplay: grid;\ngrid-template: repeat(3, 1fr) / repeat(3, 1fr);\ngap: 20px;\ngrid-auto-flow: column;\n}\n#greenLand {\ngrid-column-start: 3;\n}`,
            /* Level 47 */ `#field {\ndisplay: grid;\ngrid-template: repeat(4, 1fr) / repeat(4, 1fr);\ngrid-auto-flow: dense;\ngap: 20px;\n}\n#field div:nth-child(3n) {\ngrid-column: span 3;\n}`,
            /* Level 48 */ `#field {\ndisplay: grid;\ngrid-template: repeat(4, 1fr) / repeat(4, 1fr);\ngrid-auto-flow: column;\ngap: 15px;\n}\n#greenLand {\ngrid-column: span 3;\n}`,
            /* Level 49 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 1fr;\ngrid-auto-columns: 1fr;\n}\n#redLand {\ngrid-column: 3;\n}`,
            /* Level 50 */ `#field {\ndisplay: grid;\ngap: 20px;\ngrid-template: 1fr 1fr/1fr 1fr;\ngrid-auto-rows: 100px;\n}`,
            /* Level 51 */ `#field {\ndisplay: grid;\ngap: 20px;\ngrid-template: 1fr 1fr/1fr 1fr;\ngrid-auto-columns: 100px;\ngrid-auto-rows: 100px;\n}\n#redLand {\ngrid-column: 3;\ngrid-row: 3;\n}`,
            /* Level 52 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: 1fr 1fr/1fr 1fr;\ngrid-auto-columns: 1fr;\ngrid-auto-rows: 100px 150px;\ngrid-auto-flow: column;\n}\n#redLand {\ngrid-column: 3;\ngrid-row: 4;\n}`,
            /* Level 53 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: repeat(3, 1fr);\ngrid-auto-rows: 100px;\njustify-items: start;\n}\n#field > div {\nwidth: 75%;\n}`,
            /* Level 54 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: repeat(2, 1fr);\ngrid-auto-rows: 100px;\njustify-items: end;\n}\n#field > div {\nwidth: 70%;\n}`,
            /* Level 55 */ `#field {\ndisplay: grid;\ngrid-template: 100px 1fr/2fr 1fr;\njustify-items: center;\n}\n#field > div {\nwidth: 50%;\n}`,
            /* Level 56 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: repeat(3, 1fr) / repeat(3, 1fr);\nalign-items: start;\n}\n#field > div {\nheight: 50%;\n}`,
            /* Level 57 */ `#field {\ndisplay: grid;\ngrid-template: repeat(3, 1fr) / repeat(2, 1fr);\nalign-items: end;\n}\n#field > div {\nheight: 50%;\n}`,
            /* Level 58 */ `#field {\ndisplay: grid;\ngrid-template: 2fr 1fr/ repeat(3, 1fr);\nalign-items: center;\n}\n#field > div {\nheight: 50%;\n}`,
            /* Level 59 */ `#field {\ndisplay: grid;\ngrid-template: 1fr 1fr/2fr 1fr 1fr;\nalign-items: center;\njustify-items: center;\n}\n#field > div {\nheight: 50%;\nwidth: 50%;\n}\n#greenLand {\ngrid-column: span 2;\n}`,
            /* Level 60 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: repeat(3, 1fr);\nplace-items: center end;\n}\n#field > div {\nheight: 50%;\nwidth: 50%;\n}`,
            /* Level 61 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: 1fr 1fr/1fr 1fr;\njustify-items: end;\n}\n#field > div {\nheight: 50%;\nwidth: 50%;\n}\n#redLand {\njustify-self: start;\n}`,
            /* Level 62 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: 1fr 1fr/1fr 1fr;\n}\n#redLand {\nheight: 50%;\nwidth: 50%;\njustify-self: center;\n}`,
            /* Level 63 */ `#field {\ndisplay: grid;\ngrid-template: 1fr 1fr/ 200px 1fr;\ngap: 15px;\n}\n.redLand {\nwidth: 50%;\nheight: 50%;\njustify-self: end;\n}`,
            /* Level 64 */ `#field {\ndisplay: grid;\ngrid-template: 1fr 2fr / 1fr 2fr;\ngap: 15px;\n}\n.redLand {\nwidth: 100%;\nheight: 50%;\nalign-self: center;\n}`,
            /* Level 65 */ `#field {\ndisplay: grid;\ngrid-template: 1fr 1fr 1fr/1fr 1fr 1fr;\n}\n.redLand {\nwidth: 100%;\nheight: 50%;\nalign-self: end;\n}`,
            /* Level 66 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: 1fr 1fr/2fr 1fr;\njustify-items: center;\nalign-items: center;\n}\n#field > div {\nheight: 50%;\nwidth: 50%;\n}\n#redLand {\njustify-self: end;\nalign-self: end;\n}\n#greenLand {\njustify-self: start;\nalign-self: end;\n}`,
            /* Level 67 */ `#field {\ndisplay: grid;\ngrid-template: 1fr 1fr 1fr/2fr 1fr;\nplace-items: start;\n}\n#field > div {\nheight: 50%;\nwidth: 50%;\n}\n#redLand {\nplace-self: center end;\n}\n#greenLand {\nplace-self: start end;\n}`,
            /* Level 68 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: 150px 150px;\njustify-content: center;\n}`,
            /* Level 69 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: 30% 30%;\njustify-content: end;\n}`,
            /* Level 70 */ `#field {\ndisplay: grid;\ngrid-template: 1fr 1fr / 40% 40%;\njustify-content: space-evenly;\njustify-items: end;\n}\n#field > div {\nwidth: 50%;\nheight: 50%;\n}`,
            /* Level 71 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: 1fr 1fr;\ngrid-auto-rows: 100px;\nalign-content: center;\n}`,
            /* Level 72 */ `#field {\ndisplay: grid;\ngrid-template-columns: 40% 40%;\ngrid-auto-rows: 125px;\nalign-content: end;\n}`,
            /* Level 73 */ `#field {\ndisplay: grid;\ngrid-template-columns: 1fr 100px;\ngrid-auto-rows: 100px;\nalign-content: space-between;\n}`,
            /* Level 74 */ `#field {\ndisplay: grid;\ngrid-template: repeat(4, 1fr) / repeat(4, 1fr);\ngap: 15px;\n}\n#greenLand {\ngrid-row: 2/5;\ngrid-column: 2/4;\n}`,
            /* Level 75 */ `#field {\ndisplay: grid;\ngrid-template: repeat(3, 1fr) / repeat(3, 1fr);\ngap: 15px 10px;\ngrid-template-areas: "greenLand greenLand blueLand" "greenLand greenLand blueLand" "redLand redLand redLand";\n}\n#greenLand {\ngrid-area: greenLand;\n}\n#redLand {\ngrid-area: redLand;\n}\n#blueLand {\ngrid-area: blueLand;\n}`,
            /* Level 76 */ `#field {\ndisplay: grid;\ngrid-template-columns: minmax(max-content, 1fr) minmax(min-content, auto);\ngrid-template-rows: 1fr 1fr;\n}`,
            /* Level 77 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template-columns: repeat(auto-fill, 1fr);\ngrid-auto-rows: 100px;\nalign-content: space-between;\n}\n#field div:nth-child(3n) {\ngrid-column: span 3;\n}`,
            /* Level 78 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: "greenLand. blueLand" 1fr "greenLand redLand." 1fr / 100px 1fr 1fr;\n}\n#greenLand {\ngrid-area: greenLand;\n}\n#redLand {\ngrid-area: redLand;\n}\n#blueLand {\ngrid-area: blueLand;\nheight: 50%;\nalign-self: center;\n}`,
            /* Level 79 */ `#field {\ndisplay: grid;\ngap: 15px;\ngrid-template: repeat(4, 1fr);\n}\n#greenLand {\ngrid-column: 2/ span 3;\ngrid-row: 3/5;\n}\n#redLand {\ngrid-column: 3 / span 2;\ngrid-row: 1/4;\n}`,
            /* Level 80 */ `#field {\ndisplay: grid;\ngrid: repeat(3, 1fr);\n}\n#greenLand {\ngrid-column: 1/3;\ngrid-row: 1;\n}\n#redLand {\ngrid-column: 2/ 4;\ngrid-row: 1/3;\n}\n#blueLand {\ngrid-column: 2;\ngrid-row: 1/5;\n}`
        ];

        const gridContainer = document.getElementById('levelsGrid');
        const toast = document.getElementById('toast');
        let allExpanded = false;

        function renderLevels() {
            gridContainer.innerHTML = '';
            solutions.forEach((sol, index) => {
                const levelNum = index + 1;
                const card = document.createElement('div');
                card.className = 'card bg-slate-900 border border-slate-800 rounded-2xl shadow-md hover:border-slate-700 transition duration-200 overflow-hidden cursor-pointer flex flex-col';
                
                card.innerHTML = `
                    <div class="p-4 flex items-center justify-between select-none header-bar">
                        <div class="flex items-center gap-3">
                            <span class="w-8 h-8 rounded-xl bg-slate-800 text-indigo-400 font-bold text-sm flex items-center justify-center border border-slate-700/60">
                                ${levelNum}
                            </span>
                            <span class="font-semibold text-slate-200">Level ${levelNum}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <svg class="chevron w-5 h-5 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </div>
                    <div class="card-content px-4 pb-4">
                        <div class="relative bg-slate-950 rounded-xl p-3 border border-slate-800/80 group">
                            <pre class="code-font text-xs text-indigo-200 overflow-x-auto whitespace-pre-wrap"><code>${escapeHtml(sol)}</code></pre>
                            <button class="copy-btn absolute top-2 right-2 text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-1 rounded-lg border border-slate-700 opacity-0 group-hover:opacity-150 transition active:scale-95" title="Copiar código">
                                Copiar
                            </button>
                        </div>
                    </div>
                `;
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.copy-btn')) return;
                    card.classList.toggle('expanded');
                });
                const copyBtn = card.querySelector('.copy-btn');
                copyBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const textToCopy = sol;
                    const textarea = document.createElement('textarea');
                    textarea.value = textToCopy;
                    document.body.appendChild(textarea);
                    textarea.select();
                    try {
                        document.execCommand('copy');
                        showToast();
                    } catch (err) {
                        console.error('Error al copiar', err);
                    }
                    document.body.removeChild(textarea);
                });

                gridContainer.appendChild(card);
            });
        }
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
        function showToast() {
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2000);
        }
        document.getElementById('expandAllBtn').addEventListener('click', () => {
            const cards = document.querySelectorAll('.card');
            allExpanded = !allExpanded;
            cards.forEach(card => {
                if (allExpanded) {
                    card.classList.add('expanded');
                } else {
                    card.classList.remove('expanded');
                }
            });
            document.getElementById('expandAllBtn').textContent = allExpanded ? 'Contract all' : 'Expand all';
        });
        window.onload = function() {
            renderLevels();
        };
    </script>
</body>
</html>
